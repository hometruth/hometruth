name: Private configuration checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: installation
          fetch-depth: 0
          persist-credentials: false
      # Set this nonsecret repository variable to a reviewed public commit SHA.
      - name: Require pinned HomeTruth source
        env:
          REVISION: ${{ vars.HOMETRUTH_REVISION }}
        run: '[[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hometruth/hometruth
          ref: ${{ vars.HOMETRUTH_REVISION }}
          path: source
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - run: bash source/scripts/install-gitleaks.sh
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: source
      - run: bun run release:check --repo ../installation --kind private --history
        working-directory: source
      # This check deliberately receives no deployment secrets and starts no services.
