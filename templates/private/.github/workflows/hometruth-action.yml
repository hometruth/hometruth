name: HomeTruth local action
on:
  workflow_dispatch:
    inputs:
      arguments:
        description: JSON array of ht arguments, for example ["ls", "device", "--json"]
        required: true
        type: string
  repository_dispatch:
    types: [hometruth_action]
permissions: {}
concurrency:
  group: hometruth-local-action
  cancel-in-progress: false
jobs:
  run:
    runs-on: [self-hosted, hometruth-local]
    timeout-minutes: 15
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - name: Run HomeTruth CLI on the local installation
        env:
          HOMETRUTH_SOURCE: ${{ vars.HOMETRUTH_SOURCE }}
          HOMETRUTH_INSTALLATION: ${{ vars.HOMETRUTH_INSTALLATION }}
        shell: bash
        run: |
          set -euo pipefail
          test -d "$HOMETRUTH_SOURCE"
          test -d "$HOMETRUTH_INSTALLATION"
          cd "$HOMETRUTH_SOURCE"
          bun run site "$HOMETRUTH_INSTALLATION" local-action
